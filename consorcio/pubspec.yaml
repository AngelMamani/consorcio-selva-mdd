name: consorcio
description: App móvil para técnicos de Consorcio Selva MDD
publish_to: 'none'
version: 1.3.3+22
# versionName+versionCode — usa tool/build_release.ps1 para subir el código solo

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  uuid: ^4.6.0
  provider: ^6.1.5+1
  path: ^1.9.1
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.4.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
